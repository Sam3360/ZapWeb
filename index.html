<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚡ Zap — Sign In</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080e1a;
      --bg2: #0f172a;
      --card: #1e293b;
      --card2: #162032;
      --border: rgba(59,130,246,0.18);
      --accent: #3b82f6;
      --accent2: #6366f1;
      --accent3: #06b6d4;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --glow: rgba(59,130,246,0.35);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* Animated background */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,130,246,0.13) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 60% 20%, rgba(6,182,212,0.07) 0%, transparent 50%),
        #080e1a;
    }

    .grid-overlay {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridFloat 20s linear infinite;
    }

    @keyframes gridFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; animation: orbFloat 8s ease-in-out infinite;
    }
    .orb1 { width: 400px; height: 400px; background: rgba(59,130,246,0.12); top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 300px; height: 300px; background: rgba(99,102,241,0.1); bottom: -80px; right: -80px; animation-delay: -3s; }
    .orb3 { width: 200px; height: 200px; background: rgba(6,182,212,0.08); top: 50%; left: 60%; animation-delay: -5s; }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -20px) scale(1.05); }
      66% { transform: translate(-15px, 15px) scale(0.95); }
    }

    /* Login Container */
    .page {
      position: relative; z-index: 10;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: rgba(30,41,59,0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 52px 44px;
      width: 100%; max-width: 440px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
      animation: cardIn 0.8s cubic-bezier(0.23,1,0.32,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-bolt {
      font-size: 56px;
      display: block;
      animation: boltPulse 2.5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(59,130,246,0.6));
      line-height: 1;
      margin-bottom: 12px;
    }

    @keyframes boltPulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(59,130,246,0.6)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 35px rgba(99,102,241,0.8)); transform: scale(1.06); }
    }

    .logo-name {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #818cf8, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .logo-tagline {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: rgba(15,23,42,0.7);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    .form-input::placeholder { color: rgba(148,163,184,0.5); }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
      background: rgba(15,23,42,0.9);
    }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0;
    }

    .divider-line { flex: 1; height: 1px; background: rgba(148,163,184,0.15); }
    .divider-text { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .btn-google {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 8px 32px rgba(59,130,246,0.35);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    .btn-google::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0; transition: opacity 0.2s;
    }

    .btn-google:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(59,130,246,0.45); }
    .btn-google:hover::before { opacity: 1; }
    .btn-google:active { transform: translateY(0); }

    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .google-icon {
      width: 20px; height: 20px; flex-shrink: 0;
    }

    .status-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      transition: all 0.3s;
    }

    .status-msg.error { color: #f87171; }
    .status-msg.loading { color: var(--accent3); }
    .status-msg.success { color: #34d399; }

    .footer-links {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: rgba(148,163,184,0.5);
    }

    .features-row {
      display: flex; gap: 8px; justify-content: center;
      margin-top: 24px; flex-wrap: wrap;
    }

    .feature-chip {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: #93c5fd;
      font-weight: 500;
    }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .login-card { padding: 36px 24px; border-radius: 20px; }
      .logo-bolt { font-size: 44px; }
      .logo-name { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="page">
    <div class="login-card">
      <div class="logo-area">
        <span class="logo-bolt">⚡</span>
        <div class="logo-name">Zap</div>
        <div class="logo-tagline">Lightning-fast messaging for everyone</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="usernameInput">Choose your username</label>
        <input
          class="form-input"
          type="text"
          id="usernameInput"
          placeholder="e.g. cooldev42"
          maxlength="24"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">then sign in with</div>
        <div class="divider-line"></div>
      </div>

      <button class="btn-google" id="googleBtn" onclick="signInWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="rgba(255,255,255,0.85)" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="rgba(255,255,255,0.7)" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="rgba(255,255,255,0.9)" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span id="btnText">Continue with Google</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="status-msg" id="statusMsg"></div>

      <div class="features-row">
        <span class="feature-chip">⚡ Real-time</span>
        <span class="feature-chip">🔒 Secure</span>
        <span class="feature-chip">💬 Group Rooms</span>
        <span class="feature-chip">📱 PWA</span>
        <span class="feature-chip">🌙 Dark Mode</span>
      </div>

      <div class="footer-links">⚡ Zap · Built for speed · v1.0</div>
    </div>
  </div>

  <!-- Firebase v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDeQip7FvQDyiSdiBjNlCJc9MT5fVQcnCc",
      authDomain: "login-21af0.firebaseapp.com",
      projectId: "login-21af0",
      storageBucket: "login-21af0.appspot.com",
      messagingSenderId: "121751642387",
      appId: "1:121751642387:web:6e83c8f559dfb51f0dbae6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const setStatus = (msg, type = '') => {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.className = 'status-msg ' + type;
    };

    const setLoading = (loading) => {
      document.getElementById('googleBtn').disabled = loading;
      document.getElementById('spinner').style.display = loading ? 'block' : 'none';
      document.getElementById('btnText').textContent = loading ? 'Signing in…' : 'Continue with Google';
    };

    // Check if already logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (snap.exists()) {
          window.location.href = 'dashboard.html';
        }
      }
    });

    window.signInWithGoogle = async () => {
      const username = document.getElementById('usernameInput').value.trim();

      if (!username) {
        setStatus('⚠️ Please enter a username first.', 'error');
        document.getElementById('usernameInput').focus();
        return;
      }

      if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        setStatus('⚠️ Username: 3–24 chars, letters/numbers/underscore only.', 'error');
        return;
      }

      setLoading(true);
      setStatus('Opening Google sign-in…', 'loading');

      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        setStatus('✅ Signed in! Setting up your profile…', 'success');

        const userRef = doc(db, 'users', user.uid);
        const snap = await getDoc(userRef);

        await setDoc(userRef, {
          uid: user.uid,
          username: snap.exists() ? snap.data().username : username,
          displayName: user.displayName || username,
          email: user.email,
          photoURL: user.photoURL || '',
          online: true,
          lastSeen: serverTimestamp(),
          createdAt: snap.exists() ? snap.data().createdAt : serverTimestamp(),
          theme: 'dark'
        }, { merge: true });

        window.location.href = 'dashboard.html';

      } catch (err) {
        setLoading(false);
        if (err.code === 'auth/popup-closed-by-user') {
          setStatus('Sign-in cancelled.', 'error');
        } else if (err.code === 'auth/popup-blocked') {
          setStatus('⚠️ Popup blocked. Please allow popups for this site.', 'error');
        } else {
          setStatus('Error: ' + err.message, 'error');
          console.error(err);
        }
      }
    };

    // PWA install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });
  </script>
</body>
</html>
